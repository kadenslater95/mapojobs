services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mapojobs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mapojobs}
      POSTGRES_USER: ${POSTGRES_USER:-mapojobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mapojobs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-mapojobs} -d $${POSTGRES_DB:-mapojobs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mapojobs_pgdata:
